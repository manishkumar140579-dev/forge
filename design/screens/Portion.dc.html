<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge — Choose portion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#050608}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input,select{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #050608; color: #f2f1ee; font-family: 'IBM Plex Sans', system-ui, sans-serif;">
<div aria-hidden="true" style="padding: 56px 20px 0; opacity: 0.25;">
<p style="margin: 0; font-family: Archivo, sans-serif; font-size: 34px; font-weight: 800;">Fuel</p>
</div>
<section role="dialog" aria-modal="true" aria-labelledby="po-h" style="position: absolute; left: 0; top: 170px; width: 390px; height: 674px; box-sizing: border-box; padding: 10px 20px 34px; border-radius: 24px 24px 0 0; background: #14161c; border-top: 1px solid #2c3039; display: flex; flex-direction: column; gap: 18px;">
<div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: #3a3e49; align-self: center;"></div>
<a href="AddFood.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; align-self: flex-start; color: #c9cbd1; font-weight: 600; font-size: 15px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Back to results</a>
<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 id="po-h" style="margin: 0; font-family: Archivo, sans-serif; font-size: 24px; font-weight: 800;">Chicken breast, cooked</h1>
<p style="margin: 0; font-size: 14px; color: #9a9ca5; font-variant-numeric: tabular-nums;">Per 100 g: 165 kcal · P 31 · C 0 · F 3.6</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="grams" style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9a9ca5;">How much? (grams)</label>
<div style="display: flex; align-items: center; gap: 8px;">
<button type="button" onClick="{{dec}}" aria-label="10 grams less" style="width: 56px; height: 56px; border-radius: 16px; background: #1d2028; border: 1px solid #2c3039; color: #f2f1ee; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<input id="grams" type="number" inputmode="decimal" value="{{grams}}" onChange="{{setGrams}}" style="flex-grow: 1; min-width: 0; height: 56px; box-sizing: border-box; border-radius: 16px; background: #0f1116; border: 2px solid {{accent}}; color: #f2f1ee; text-align: center; font-family: Archivo, sans-serif; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; outline: none;">
<button type="button" onClick="{{inc}}" aria-label="10 grams more" style="width: 56px; height: 56px; border-radius: 16px; background: #1d2028; border: 1px solid #2c3039; color: #f2f1ee; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 44px; border-radius: 22px; border: 1px solid #2c3039; background: {{c.bg}}; color: {{c.fg}}; font-weight: 600; font-size: 14px; cursor: pointer;">{{c.label}}</button>
</sc-for>
</div>
</div>
<dl aria-live="polite" style="margin: 0; padding: 16px; border-radius: 16px; background: #0f1116; border: 1px solid #22252e; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
<div style="display: flex; flex-direction: column; gap: 2px;"><dt style="font-size: 12px; color: #9a9ca5;">Calories</dt><dd style="margin: 0; font-family: Archivo, sans-serif; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;">{{kcal}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px;"><dt style="font-size: 12px; color: #9a9ca5;">Protein</dt><dd style="margin: 0; font-family: Archivo, sans-serif; font-size: 22px; font-weight: 800; color: #ff6b8a; font-variant-numeric: tabular-nums;">{{p}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px;"><dt style="font-size: 12px; color: #9a9ca5;">Carbs</dt><dd style="margin: 0; font-family: Archivo, sans-serif; font-size: 22px; font-weight: 800; color: #5cb8ff; font-variant-numeric: tabular-nums;">{{c}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px;"><dt style="font-size: 12px; color: #9a9ca5;">Fat</dt><dd style="margin: 0; font-family: Archivo, sans-serif; font-size: 22px; font-weight: 800; color: #f5c542; font-variant-numeric: tabular-nums;">{{f}}</dd></div>
</dl>
<div style="flex-grow: 1;"></div>
<a href="Fuel.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: {{accent}}; color: #1a0b05; font-weight: 700; font-size: 17px;">Add {{grams}} g to Lunch</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff6a3d","options":["#ff6a3d","#4f9dff","#3ecf8e","#b58cff"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#ff6a3d';
    const g = s.grams != null ? s.grams : 150;
    const one = (x) => String(Math.round(x * 10) / 10);
    const chips = [50, 100, 150, 200].map((v) => ({
      label: v + ' g',
      pressed: g === v ? 'true' : 'false',
      bg: g === v ? accent : '#1d2028',
      fg: g === v ? '#1a0b05' : '#f2f1ee',
      pick: () => this.setState({ grams: v })
    }));
    return {
      accent: accent,
      grams: g,
      chips: chips,
      kcal: Math.round((165 * g) / 100),
      p: one((31 * g) / 100) + ' g',
      c: '0 g',
      f: one((3.6 * g) / 100) + ' g',
      dec: () => this.setState({ grams: Math.max(0, g - 10) }),
      inc: () => this.setState({ grams: g + 10 }),
      setGrams: (e) => this.setState({ grams: Math.max(0, Number(e.target.value) || 0) })
    };
  }
}
</script>
</body>
</html>
