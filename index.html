<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="./app.css">
  <title>Forge — Workout Tracker</title>
</head>
<body>
  <main id="app"></main>
  <dialog id="modal"></dialog>

  <!-- classic scripts share global scope; loaded in order. No build step. -->
  <script src="./qrcode.js"></script>
  <script src="./calc.js"></script>
  <script src="./store.js"></script>
  <script src="./health.js"></script>
  <script src="./app.js"></script>

  <!-- Self-heal: if a stale/mixed service-worker cache white-screens the app,
       purge caches + service workers and reload once (guarded against loops). -->
  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        var app = document.getElementById("app");
        if (!app || app.children.length > 0 || sessionStorage.getItem("forge-healed")) return;
        sessionStorage.setItem("forge-healed", "1");
        var reload = function () { location.reload(); };
        var p = window.caches
          ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
          : Promise.resolve();
        p.then(function () {
          if ("serviceWorker" in navigator) {
            return navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            });
          }
        }).then(reload, reload);
      }, 1500);
    });
  </script>
</body>
</html>
